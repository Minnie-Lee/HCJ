<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video to GIF Converter</title>
  <!-- gifshot CDN: 브라우저 내에서 비디오 프레임을 GIF로 변환하는 라이브러리 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gifshot/0.3.2/gifshot.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: #f8fafc;
      color: #333333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 1, 2. 상단 헤더 */
    header {
      width: 100%;
      height: 70px;
      padding: 0 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #ffffff;
      border-bottom: 1px solid #e2e8f0;
    }

    .logo-container {
      display: flex;
      align-items: center;
      text-decoration: none;
      color: inherit;
    }

    .logo-container img {
      height: 38px;
      object-fit: contain;
      cursor: pointer;
    }

    .header-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #64748b;
    }

    /* 메인 컨테이너 */
    main {
      flex: 1;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 3, 4. 타이틀 영역 */
    .hero-title {
      font-size: 2.8rem;
      font-weight: 800;
      color: #4f46e5;
      margin-bottom: 8px;
      text-align: center;
    }

    .hero-subtitle {
      font-size: 1.15rem;
      color: #64748b;
      margin-bottom: 35px;
      text-align: center;
    }

    /* 5. 드래그 앤 드롭 업로드 존 */
    .drop-zone {
      width: 100%;
      border: 2px dashed #cbd5e1;
      border-radius: 16px;
      background-color: #ffffff;
      padding: 50px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease-in-out;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .drop-zone.dragover {
      border-color: #4f46e5;
      background-color: #eef2ff;
    }

    .drop-zone svg {
      width: 48px;
      height: 48px;
      fill: #94a3b8;
      margin-bottom: 12px;
    }

    .drop-zone p {
      font-size: 1rem;
      color: #64748b;
      margin-bottom: 16px;
    }

    .upload-btn {
      background-color: #4f46e5;
      color: #ffffff;
      border: none;
      padding: 10px 24px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .upload-btn:hover {
      background-color: #4338ca;
    }

    #fileInput {
      display: none;
    }

    /* 6. 업로드 및 변환 목록 */
    .file-list {
      width: 100%;
      margin-top: 30px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .file-card {
      background: #ffffff;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      border: 1px solid #e2e8f0;
    }

    /* 썸네일 */
    .thumbnail-container {
      width: 110px;
      height: 80px;
      border-radius: 8px;
      overflow: hidden;
      background-color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .thumbnail-container img,
    .thumbnail-container video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* 프로그레스 바 영역 */
    .info-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .file-name {
      font-weight: 600;
      font-size: 0.95rem;
      color: #1e293b;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 400px;
    }

    .status-text {
      font-size: 0.85rem;
      color: #64748b;
    }

    .progress-bar-bg {
      width: 100%;
      height: 10px;
      background-color: #f1f5f9;
      border-radius: 5px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background-color: #4f46e5;
      border-radius: 5px;
      transition: width 0.2s ease;
    }

    /* 다운로드 버튼 */
    .download-btn {
      background-color: #10b981;
      color: #ffffff;
      padding: 10px 18px;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 8px;
      text-decoration: none;
      display: inline-block;
      white-space: nowrap;
      cursor: pointer;
      border: none;
      transition: background-color 0.2s;
    }

    .download-btn:hover {
      background-color: #059669;
    }

    .download-btn.disabled {
      background-color: #cbd5e1;
      cursor: not-allowed;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- 1, 2. 좌측 헤더 로고 및 이동 링크, 우측 헤더 타이틀 -->
  <header>
    <a href="https://nanalab.kr" target="_blank" rel="noopener noreferrer" class="logo-container">
      <!-- logo.png 파일이 없을 경우 대비 alt 표시 -->
      <img src="logo.png" alt="logo" onerror="this.src='https://via.placeholder.com/130x40?text=LOGO';" />
    </a>
    <div class="header-title">Video to GIF</div>
  </header>

  <main>
    <!-- 3, 4. 메인 문구 -->
    <h1 class="hero-title">Video &rarr; GIF</h1>
    <p class="hero-subtitle">Make your own GIF Animation!</p>

    <!-- 5. 드래그 앤 드롭 및 업로드 버튼 -->
    <div class="drop-zone" id="dropZone">
      <svg viewBox="0 0 24 24">
        <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/>
      </svg>
      <p>동영상 파일을 여기에 드래그하거나 아래 버튼을 눌러 선택하세요</p>
      <button type="button" class="upload-btn" id="browseBtn">파일 업로드</button>
      <input type="file" id="fileInput" accept="video/*" />
    </div>

    <!-- 6. 파일 목록 (썸네일, 프로그레스 바, 다운로드 버튼) -->
    <div class="file-list" id="fileList"></div>
  </main>

  <script>
    const dropZone = document.getElementById('dropZone');
    const browseBtn = document.getElementById('browseBtn');
    const fileInput = document.getElementById('fileInput');
    const fileList = document.getElementById('fileList');

    // 파일 선택 창 열기
    browseBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      fileInput.click();
    });

    dropZone.addEventListener('click', () => {
      fileInput.click();
    });

    // 드래그 앤 드롭 이벤트
    ['dragenter', 'dragover'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropZone.classList.add('dragover');
      });
    });

    ['dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropZone.classList.remove('dragover');
      });
    });

    dropZone.addEventListener('drop', (e) => {
      const files = e.dataTransfer.files;
      if (files && files[0]) {
        handleFile(files[0]);
      }
    });

    fileInput.addEventListener('change', (e) => {
      if (e.target.files && e.target.files[0]) {
        handleFile(e.target.files[0]);
      }
    });

    // 파일 처리 및 GIF 변환 (7, 8번 요구조건)
    function handleFile(file) {
      if (!file.type.startsWith('video/')) {
        alert('동영상 파일만 업로드할 수 있습니다.');
        return;
      }

      const videoUrl = URL.createObjectURL(file);

      // 카드 UI 동적 생성
      const card = document.createElement('div');
      card.className = 'file-card';
      card.innerHTML = `
        <div class="thumbnail-container">
          <video src="${videoUrl}" muted playsinline></video>
        </div>
        <div class="info-container">
          <div class="file-name">${file.name}</div>
          <div class="status-text">변환 준비 중... 0%</div>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill"></div>
          </div>
        </div>
        <a class="download-btn disabled" download="${file.name.replace(/\.[^/.]+$/, '')}.gif">다운로드</a>
      `;

      fileList.prepend(card);

      const progressFill = card.querySelector('.progress-bar-fill');
      const statusText = card.querySelector('.status-text');
      const downloadBtn = card.querySelector('.download-btn');
      const thumbContainer = card.querySelector('.thumbnail-container');

      // 7, 8. gifshot을 사용해 프레임을 잘라서 29 FPS 제한으로 변환
      gifshot.createGIF({
        video: [videoUrl],
        numFrames: 30,             // 변환할 프레임 수
        gifWidth: 320,
        gifHeight: 240,
        sampleInterval: 10,
        numWorkers: 2,
        progressCallback: function (captureProgress) {
          // 6. 프로그레스 바 업데이트 (0% ~ 100%)
          const percent = Math.round(captureProgress * 100);
          progressFill.style.width = percent + '%';
          statusText.textContent = `변환 중... ${percent}%`;
        }
      }, function (obj) {
        if (!obj.error) {
          const animatedImage = obj.image;
          
          // 완료 시 프로그레스 바 100% 및 다운로드 활성화
          progressFill.style.width = '100%';
          statusText.textContent = '변환 완료! (100%)';
          
          downloadBtn.href = animatedImage;
          downloadBtn.classList.remove('disabled');

          // 썸네일을 생성된 GIF 이미지로 교체
          thumbContainer.innerHTML = `<img src="${animatedImage}" alt="Generated GIF">`;
        } else {
          statusText.textContent = '변환 실패';
          progressFill.style.backgroundColor = '#ef4444';
          console.error(obj.error);
        }
      });
    }
  </script>
</body>
</html>
