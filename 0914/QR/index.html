<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart QR</title>
  
  <!-- FontAwesome 6 & Pretendard Font -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  
  <!-- QRCode.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    :root {
      --mouse-x: 50%;
      --mouse-y: 50%;

      --accent-warm: #FFA940;
      --accent-pink: #FF8E85;
      --accent-peach: #FFD8A8;
      --text-dark: #38241D;
      --text-muted: #8F766C;

      --glass-surface: rgba(255, 255, 255, 0.78);
      --glass-border: rgba(255, 255, 255, 0.95);
      --glass-shadow: 0 20px 40px -15px rgba(255, 140, 110, 0.14), 0 0 1px 1px rgba(255, 255, 255, 0.8);
      --card-hover-shadow: 0 28px 50px -12px rgba(255, 130, 92, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100vh;
      background-color: #FFFDF9;
      color: var(--text-dark);
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      position: relative;
    }

    /* 마우스 인터랙티브 반응형 그라데이션 배경 */
    .interactive-mesh-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(circle 650px at var(--mouse-x) var(--mouse-y), rgba(255, 210, 168, 0.55), transparent 70%),
        radial-gradient(circle 500px at calc(100% - var(--mouse-x)) calc(100% - var(--mouse-y)), rgba(255, 192, 203, 0.45), transparent 70%),
        linear-gradient(135deg, #FFFDF9 0%, #FFF5EC 50%, #FFF0EB 100%);
      transition: background 0.15s ease-out;
    }

    /* 헤더 */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 80px;
      padding: 0 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 50;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      background: rgba(255, 255, 255, 0.65);
      border-bottom: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 4px 20px rgba(255, 180, 140, 0.06);
    }

    .header-logo-area {
      display: flex;
      align-items: center;
      height: 100%;
    }

    .site-logo-img {
      height: 46px;
      max-width: 180px;
      object-fit: contain;
      cursor: pointer;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .site-logo-img:hover {
      transform: scale(1.04);
    }

    .brand-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid #FFE6D5;
      padding: 8px 18px;
      border-radius: 99px;
      box-shadow: 0 4px 14px rgba(255, 169, 64, 0.08);
    }

    .site-title {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-dark);
    }

    .site-title span {
      color: #FFA940;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #FFA940;
      border-radius: 50%;
      box-shadow: 0 0 0 4px rgba(255, 169, 64, 0.2);
    }

    /* 메인 콘텐츠 영역 */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 24px 24px 24px;
      position: relative;
      z-index: 10;
    }

    /* URL 입력 독 영역 */
    .input-wrapper {
      width: 100%;
      max-width: 600px;
      z-index: 30;
      transition: all 0.75s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .input-wrapper.state-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .input-wrapper.state-bottom {
      position: fixed;
      top: auto;
      bottom: 34px;
      left: 50%;
      transform: translate(-50%, 0);
    }

    .hero-text {
      text-align: center;
      margin-bottom: 24px;
      transition: opacity 0.3s ease;
    }

    .state-bottom .hero-text {
      display: none;
    }

    .hero-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 14px;
      background: rgba(255, 169, 64, 0.12);
      border: 1px solid rgba(255, 169, 64, 0.25);
      color: #D96A00;
      font-size: 0.84rem;
      font-weight: 700;
      border-radius: 99px;
      margin-bottom: 12px;
    }

    .hero-text h1 {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--text-dark);
      letter-spacing: -0.03em;
      margin-bottom: 8px;
    }

    .hero-text p {
      font-size: 1rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .input-card {
      background: var(--glass-surface);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 2px solid var(--glass-border);
      border-radius: 40px;
      padding: 8px 10px 8px 22px;
      display: flex;
      align-items: center;
      box-shadow: var(--glass-shadow);
      transition: all 0.3s ease;
    }

    .input-card:focus-within {
      border-color: rgba(255, 169, 64, 0.7);
      background: #FFFFFF;
      box-shadow: 0 16px 36px -8px rgba(255, 169, 64, 0.25), 0 0 0 4px rgba(255, 169, 64, 0.12);
      transform: translateY(-2px);
    }

    .input-icon-left {
      color: #FFA940;
      font-size: 1.2rem;
      margin-right: 14px;
    }

    .qr-text-input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 1.05rem;
      font-weight: 500;
      color: var(--text-dark);
      background: transparent;
      padding: 10px 0;
      min-width: 0;
    }

    .qr-text-input::placeholder {
      color: #C0AAA2;
    }

    .action-btn {
      background: linear-gradient(135deg, #FFB156 0%, #FF8E66 100%);
      color: #FFFFFF;
      border: none;
      border-radius: 30px;
      padding: 14px 26px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 6px 18px rgba(255, 142, 102, 0.35);
      transition: all 0.25s ease;
      white-space: nowrap;
    }

    .action-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 22px rgba(255, 142, 102, 0.45);
    }

    .action-btn:active {
      transform: scale(0.97);
    }

    /* 중앙 QR 카드 */
    .qr-stage {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: absolute;
      top: calc(50% - 20px);
      left: 50%;
      transform: translate(-50%, -50%) scale(0.88);
      opacity: 0;
      transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 20;
    }

    .qr-stage.active {
      display: flex;
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .qr-glass-card {
      background: var(--glass-surface);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      padding: 28px;
      border-radius: 34px;
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      position: relative;
      transition: all 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .qr-glass-card:hover {
      transform: translateY(-6px);
      box-shadow: var(--card-hover-shadow);
      border-color: rgba(255, 177, 86, 0.45);
    }

    .card-top-tag {
      position: absolute;
      top: -12px;
      background: linear-gradient(135deg, #FFA940, #FF8E66);
      color: #FFF;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 14px;
      border-radius: 99px;
      letter-spacing: 0.05em;
      box-shadow: 0 4px 12px rgba(255, 142, 102, 0.3);
    }

    .qr-frame {
      background: #FFFFFF;
      padding: 18px;
      border-radius: 24px;
      box-shadow: 0 8px 24px rgba(255, 180, 150, 0.12);
      position: relative;
      overflow: hidden;
    }

    .qr-frame canvas, .qr-frame img {
      display: block;
      width: 215px !important;
      height: 215px !important;
      border-radius: 10px;
    }

    /* 카드 호버 다운로드 안내 */
    .qr-download-overlay {
      position: absolute;
      inset: 0;
      background: rgba(56, 36, 29, 0.82);
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      opacity: 0;
      backdrop-filter: blur(3px);
      transition: opacity 0.25s ease;
    }

    .qr-glass-card:hover .qr-download-overlay {
      opacity: 1;
    }

    .dl-icon-circle {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: linear-gradient(135deg, #FFB156, #FF8E66);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      box-shadow: 0 8px 18px rgba(255, 142, 102, 0.4);
    }

    .dl-text-primary {
      color: #FFFFFF;
      font-weight: 700;
      font-size: 0.95rem;
    }

    .dl-text-badge {
      font-size: 0.74rem;
      background: rgba(255, 255, 255, 0.2);
      color: #FFE6D5;
      padding: 3px 10px;
      border-radius: 20px;
    }

    .qr-meta {
      margin-top: 18px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .url-chip {
      max-width: 240px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-dark);
      background: #FFF2E8;
      border: 1px solid #FFDECB;
      padding: 5px 14px;
      border-radius: 99px;
    }

    .download-cue {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--text-dark);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .download-cue i {
      color: #FFA940;
    }

    /* 토스트 팝업 */
    .toast-pill {
      position: fixed;
      top: 96px;
      background: rgba(56, 36, 29, 0.92);
      color: #FFFFFF;
      padding: 12px 24px;
      border-radius: 99px;
      font-size: 0.92rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 9px;
      box-shadow: 0 14px 30px rgba(56, 36, 29, 0.15);
      z-index: 100;
      opacity: 0;
      transform: translateY(-16px);
      pointer-events: none;
      transition: all 0.3s ease;
    }

    .toast-pill.active {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 600px) {
      header {
        padding: 0 20px;
        height: 70px;
      }
      .site-logo-img {
        height: 38px;
      }
      .input-wrapper {
        width: calc(100% - 32px);
      }
      .input-wrapper.state-bottom {
        bottom: 20px;
      }
      .hero-text h1 {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>

  <!-- 마우스 위치 반응형 인터랙티브 배경 -->
  <div class="interactive-mesh-bg" id="interactiveBg"></div>

  <!-- 헤더 (좌측: logo.png, 우측: Smart QR) -->
  <header>
    <div class="header-logo-area">
      <img src="logo.png" alt="NaNa Lab Logo" class="site-logo-img" onerror="handleLogoFallback(this)" />
    </div>
    
    <div class="brand-pill">
      <span class="status-dot"></span>
      <div class="site-title">Smart <span>QR</span></div>
    </div>
  </header>

  <main>
    <!-- 정중앙 QR 코드 표시 카드 -->
    <section class="qr-stage" id="qrStage">
      <div class="qr-glass-card" id="qrCard" title="클릭하여 JPG 다운로드">
        <div class="card-top-tag">NaNa Lab</div>
        
        <div class="qr-frame">
          <div id="qrcode"></div>
          
          <div class="qr-download-overlay">
            <div class="dl-icon-circle">
              <i class="fa-solid fa-arrow-down-to-bracket"></i>
            </div>
            <div class="dl-text-primary">클릭하여 저장하기</div>
            <div class="dl-text-badge">High Resolution JPG</div>
          </div>
        </div>

        <div class="qr-meta">
          <div class="url-chip" id="urlChip">https://example.com</div>
          <div class="download-cue">
            <i class="fa-solid fa-circle-arrow-down"></i>
            <span>QR 코드를 누르면 JPG로 다운로드됩니다</span>
          </div>
        </div>
      </div>
    </section>

    <!-- URL 입력창 (초기 중앙 -> 입력 후 하단 배치) -->
    <section class="input-wrapper state-center" id="inputWrapper">
      <div class="hero-text" id="heroText">
        <div class="hero-tag">
          <i class="fa-solid fa-sparkles"></i> Instant Generator
        </div>
        <h1>스마트하고 깔끔한<br>QR 코드를 만들어보세요</h1>
        <p>변환할 링크(URL)를 입력하고 확인을 눌러주세요</p>
      </div>

      <form id="qrForm" class="input-card" onsubmit="generateQRCode(event)">
        <div class="input-icon-left">
          <i class="fa-solid fa-link"></i>
        </div>
        <input 
          type="text" 
          id="urlInput" 
          class="qr-text-input" 
          placeholder="https://example.com 형식으로 입력하세요" 
          autocomplete="off" 
          required 
        />
        <button type="submit" class="action-btn" id="submitBtn">
          <span>확인</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>
    </section>
  </main>

  <!-- 토스트 알림 -->
  <div class="toast-pill" id="toast">
    <i class="fa-solid fa-circle-check" style="color: #FFA940;"></i>
    <span id="toastMsg">QR 코드가 JPG 파일로 저장되었습니다.</span>
  </div>

  <script>
    // 마우스 커서 위치 추적 -> 배경 그라데이션 광원 좌표 업데이트
    const root = document.documentElement;
    window.addEventListener('mousemove', (e) => {
      const xPercent = ((e.clientX / window.innerWidth) * 100).toFixed(1);
      const yPercent = ((e.clientY / window.innerHeight) * 100).toFixed(1);
      root.style.setProperty('--mouse-x', `${xPercent}%`);
      root.style.setProperty('--mouse-y', `${yPercent}%`);
    });

    const inputWrapper = document.getElementById('inputWrapper');
    const qrStage = document.getElementById('qrStage');
    const urlInput = document.getElementById('urlInput');
    const qrcodeElement = document.getElementById('qrcode');
    const urlChip = document.getElementById('urlChip');
    const qrCard = document.getElementById('qrCard');
    const submitBtn = document.getElementById('submitBtn');
    const toast = document.getElementById('toast');
    const toastMsg = document.getElementById('toastMsg');

    let qrInstance = null;
    let activeUrl = '';

    // 로고 이미지 로드 실패 시 대체 벡터 로고
    function handleLogoFallback(img) {
      const svg = `
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 64" width="170" height="44">
        <ellipse cx="38" cy="42" rx="28" ry="18" fill="#FFA940" opacity="0.25"/>
        <circle cx="38" cy="28" r="16" fill="#FFA940"/>
        <text x="76" y="44" font-family="Pretendard, sans-serif" font-size="34" font-weight="900" fill="#FFA940">NaNa</text>
        <text x="175" y="44" font-family="Pretendard, sans-serif" font-size="34" font-weight="900" fill="#38241D">Lab</text>
      </svg>`;
      img.src = 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
    }

    // QR 생성 및 위치 이동
    function generateQRCode(e) {
      e.preventDefault();
      let inputVal = urlInput.value.trim();

      if (!inputVal) {
        showToast('URL을 입력해주세요!');
        return;
      }

      if (!/^https?:\/\//i.test(inputVal)) {
        inputVal = 'https://' + inputVal;
      }

      activeUrl = inputVal;
      urlChip.textContent = inputVal;

      qrcodeElement.innerHTML = '';
      qrInstance = new QRCode(qrcodeElement, {
        text: inputVal,
        width: 215,
        height: 215,
        colorDark: "#38241D",
        colorLight: "#FFFFFF",
        correctLevel: QRCode.CorrectLevel.H
      });

      // 입력창을 하단으로 이동
      inputWrapper.classList.remove('state-center');
      inputWrapper.classList.add('state-bottom');

      submitBtn.querySelector('span').textContent = '변경하기';
      submitBtn.querySelector('i').className = 'fa-solid fa-rotate';

      // 중앙 QR 카드 부드럽게 등장
      setTimeout(() => {
        qrStage.classList.add('active');
      }, 150);
    }

    // QR 클릭 시 JPG 다운로드
    qrCard.addEventListener('click', () => {
      if (!qrInstance) return;

      const imgOrCanvas = qrcodeElement.querySelector('canvas') || qrcodeElement.querySelector('img');
      if (!imgOrCanvas) {
        showToast('QR 코드를 구성 중입니다.');
        return;
      }

      const exportCanvas = document.createElement('canvas');
      const size = 1080;
      exportCanvas.width = size;
      exportCanvas.height = size;
      const ctx = exportCanvas.getContext('2d');

      // 1. 순백색 배경
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, size, size);

      // 2. 우아한 연한 피치색 테두리
      ctx.strokeStyle = '#FFEADB';
      ctx.lineWidth = 16;
      drawRoundedRect(ctx, 40, 40, size - 80, size - 80, 52);
      ctx.stroke();

      // 3. QR 코드 본체 렌더링
      const qrDim = 720;
      const offset = (size - qrDim) / 2 - 25;

      const executeDownload = (drawable) => {
        ctx.drawImage(drawable, offset, offset, qrDim, qrDim);

        ctx.fillStyle = '#38241D';
        ctx.font = 'bold 42px Pretendard, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Smart QR Code', size / 2, offset - 45);

        ctx.fillStyle = '#8F766C';
        ctx.font = '500 26px Pretendard, sans-serif';
        const displayUrl = activeUrl.length > 45 ? activeUrl.substring(0, 42) + '...' : activeUrl;
        ctx.fillText(displayUrl, size / 2, offset + qrDim + 56);

        const jpgDataUrl = exportCanvas.toDataURL('image/jpeg', 0.95);
        const a = document.createElement('a');
        a.href = jpgDataUrl;
        
        let safeName = activeUrl.replace(/https?:\/\//i, '').replace(/[^a-zA-Z0-9]/g, '_');
        if (safeName.length > 22) safeName = safeName.substring(0, 22);
        a.download = `SmartQR_${safeName || 'download'}.jpg`;

        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

        showToast('QR 코드가 JPG 파일로 저장되었습니다!');
      };

      if (imgOrCanvas instanceof HTMLCanvasElement) {
        executeDownload(imgOrCanvas);
      } else if (imgOrCanvas instanceof HTMLImageElement) {
        if (imgOrCanvas.complete) {
          executeDownload(imgOrCanvas);
        } else {
          imgOrCanvas.onload = () => executeDownload(imgOrCanvas);
        }
      }
    });

    function drawRoundedRect(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    function showToast(msg) {
      toastMsg.textContent = msg;
      toast.classList.add('active');
      setTimeout(() => {
        toast.classList.remove('active');
      }, 2500);
    }
  </script>
</body>
</html>
