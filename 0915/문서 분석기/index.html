<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>문서 분석기</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&family=Noto+Sans+KR:wght@400;600;800&display=swap');
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#182033;font-family:"Noto Sans KR",sans-serif;
background:radial-gradient(circle at var(--mx,20%) var(--my,20%),#fff 0 8%,rgba(255,255,255,.35) 22%,transparent 45%),
radial-gradient(circle at 8% 5%,#dff3ff,transparent 35%),radial-gradient(circle at 92% 10%,#eee6ff,transparent 34%),
radial-gradient(circle at 55% 100%,#fff0dc,transparent 38%),#f8faff;overflow-x:hidden}
body:before{content:"";position:fixed;width:420px;height:420px;border-radius:50%;pointer-events:none;
left:calc(var(--mx,50%) - 210px);top:calc(var(--my,30%) - 210px);
background:radial-gradient(circle,rgba(121,143,255,.13),transparent 68%);filter:blur(12px);transition:left .55s ease,top .55s ease}
.wrap{width:min(1040px,92%);margin:auto;padding:34px 0 70px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:45px}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:21px}.mark{width:42px;height:42px;border-radius:14px;
background:linear-gradient(135deg,#5b7cfa,#a27dff);display:grid;place-items:center;color:#fff;box-shadow:0 10px 24px #5b7cfa33}
.badge{padding:9px 14px;border-radius:999px;background:#ffffffb8;border:1px solid #fff;color:#65708a;font-size:13px}
.hero{text-align:center;margin-bottom:28px}.eyebrow{display:inline-block;padding:8px 13px;border-radius:999px;background:#ffffffbf;border:1px solid #fff;color:#6276c9;font-size:12px;font-weight:800;letter-spacing:.08em}
h1{margin:16px 0 10px;font-size:clamp(34px,6vw,58px);line-height:1.08;letter-spacing:-.055em;
background:linear-gradient(100deg,#496ff5,#8668ed,#e08e74);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0;color:#697386}.card{padding:28px;border-radius:28px;background:#ffffffd1;backdrop-filter:blur(22px);border:1px solid #fff;box-shadow:0 25px 70px #2c3d6e1a}
.drop{display:block;border:2px dashed #5b7cfa40;border-radius:22px;padding:36px 20px;text-align:center;cursor:pointer;background:#ffffff99;transition:.25s}
.drop:hover,.drop.drag{transform:translateY(-2px);border-color:#5b7cfa8c;box-shadow:0 15px 35px #5b7cfa17}.icon{font-size:43px;margin-bottom:8px}
.drop h2{margin:0 0 7px;font-size:20px}.drop p{margin:0;color:#7a8497;font-size:14px}input{display:none}.file-name{margin-top:15px;color:#56627a;font-size:13px;min-height:20px}
.actions{display:flex;justify-content:center;gap:10px;margin-top:18px}button{border:0;border-radius:14px;padding:13px 22px;font:700 14px "Noto Sans KR";cursor:pointer}
.primary{color:#fff;background:linear-gradient(135deg,#5b7cfa,#9a7bff);box-shadow:0 12px 25px #5b7cfa38}.secondary{background:#fff;color:#5e6980;border:1px solid #e6eaf3}
button:disabled{opacity:.45;cursor:not-allowed}.status{text-align:center;margin:16px 0 0;color:#697386;font-size:13px;min-height:20px}
.results{display:none;margin-top:25px;grid-template-columns:repeat(4,1fr);gap:14px}.results.show{display:grid}.stat{padding:23px 18px;border-radius:22px;background:#fffffff0;border:1px solid #fff;box-shadow:0 15px 40px #2c3d6e14;text-align:center}
.label{font-size:13px;color:#7a8497}.num{font-family:"DM Sans";font-size:35px;font-weight:700;margin-top:7px}.details{display:none;margin-top:15px;padding:21px 23px;border-radius:22px;background:#ffffffc7;border:1px solid #fff;color:#687388;font-size:13px;line-height:1.8}.details.show{display:block}.details strong{color:#313b50}
footer{text-align:center;color:#929bad;font-size:12px;margin-top:28px}@media(max-width:700px){.results{grid-template-columns:repeat(2,1fr)}.card{padding:17px}header{margin-bottom:32px}}
</style>
</head>
<body>
<div class="wrap">
<header><div class="brand"><div class="mark">文</div><span>문서 분석기</span></div><div class="badge">PDF · DOCX</div></header>
<section class="hero"><span class="eyebrow">SIMPLE · FAST · PRIVATE</span><h1>문서 속 숫자를<br>한눈에 확인하세요.</h1>
<p>PDF 또는 DOCX를 올리면 글자, 단어, 공백, 이미지 수를 계산합니다.</p></section>
<section class="card">
<label class="drop" id="drop"><input id="file" type="file" accept=".pdf,.docx,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document">
<div class="icon">📄</div><h2>문서를 여기에 놓아주세요</h2><p>클릭해서 PDF / DOCX 파일을 선택할 수도 있습니다.</p><div class="file-name" id="fileName">선택된 파일 없음</div></label>
<div class="actions"><button class="primary" id="analyze" disabled>문서 분석하기</button><button class="secondary" id="reset">초기화</button></div>
<div class="status" id="status"></div></section>
<section class="results" id="results">
<div class="stat"><div class="label">글자 수</div><div class="num" id="chars">0</div></div>
<div class="stat"><div class="label">단어 수</div><div class="num" id="words">0</div></div>
<div class="stat"><div class="label">공백 수</div><div class="num" id="spaces">0</div></div>
<div class="stat"><div class="label">이미지 수</div><div class="num" id="images">0</div></div>
</section>
<section class="details" id="details"></section>
<footer>문서는 브라우저에서 직접 분석되며 서버로 업로드하지 않습니다.</footer>
</div>
<script>
let selectedFile=null;
const fileInput=document.getElementById("file"),drop=document.getElementById("drop"),analyze=document.getElementById("analyze"),
nameEl=document.getElementById("fileName"),status=document.getElementById("status"),results=document.getElementById("results"),details=document.getElementById("details");
document.addEventListener("mousemove",e=>{document.documentElement.style.setProperty("--mx",e.clientX+"px");document.documentElement.style.setProperty("--my",e.clientY+"px")});
fileInput.onchange=()=>selectFile(fileInput.files[0]);
["dragenter","dragover"].forEach(x=>drop.addEventListener(x,e=>{e.preventDefault();drop.classList.add("drag")}));
["dragleave","drop"].forEach(x=>drop.addEventListener(x,e=>{e.preventDefault();drop.classList.remove("drag")}));
drop.addEventListener("drop",e=>selectFile(e.dataTransfer.files[0]));
function selectFile(f){if(!f)return;let ext=f.name.toLowerCase().split(".").pop();if(!["pdf","docx"].includes(ext)){status.textContent="PDF 또는 DOCX 파일만 선택할 수 있습니다.";return}
selectedFile=f;analyze.disabled=false;nameEl.textContent=f.name+" · "+(f.size/1048576).toFixed(2)+" MB";status.textContent="분석할 준비가 되었습니다.";results.classList.remove("show");details.classList.remove("show")}
function countText(t){let chars=[...t].length,spaces=(t.match(/\s/g)||[]).length,words=t.trim()?t.trim().split(/\s+/u).length:0;return{chars,spaces,words}}
let pdfReady=null;
async function getPDF(){if(!pdfReady)pdfReady=import("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs").then(p=>{p.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";return p});return pdfReady}
async function analyzePDF(f){let p=await getPDF(),pdf=await p.getDocument({data:await f.arrayBuffer()}).promise,t="",images=0;
for(let i=1;i<=pdf.numPages;i++){let page=await pdf.getPage(i),c=await page.getTextContent();t+=c.items.map(x=>x.str||"").join(" ")+"\n";let ops=await page.getOperatorList();
for(let fn of ops.fnArray)if([p.OPS.paintImageXObject,p.OPS.paintImageMaskXObject,p.OPS.paintInlineImageXObject,p.OPS.paintImageXObjectRepeat].includes(fn))images++}
return{...countText(t),images,pages:pdf.numPages}}
let zipReady=null;
function getZip(){if(!zipReady)zipReady=new Promise((ok,no)=>{let s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js";s.onload=()=>ok(JSZip);s.onerror=no;document.head.appendChild(s)});return zipReady}
async function analyzeDOCX(f){let Z=await getZip(),z=await Z.loadAsync(await f.arrayBuffer()),images=0;
z.forEach((p,e)=>{if(/^word\/media\//i.test(p)&&!e.dir)images++});let d=z.file("word/document.xml");if(!d)throw Error("document.xml not found");
let xml=await d.async("string"),dom=new DOMParser().parseFromString(xml,"application/xml"),t=[...dom.querySelectorAll("w\\:t")].map(x=>x.textContent||"").join(" ");return{...countText(t),images,pages:null}}
function show(d,ext){["chars","words","spaces","images"].forEach(k=>document.getElementById(k).textContent=d[k].toLocaleString());results.classList.add("show");
details.innerHTML="<strong>파일:</strong> "+esc(selectedFile.name)+"<br><strong>형식:</strong> "+ext.toUpperCase()+(d.pages?" · 페이지 "+d.pages+"쪽":"")+"<br><strong>계산 기준:</strong> 글자 수는 공백 포함 전체 문자 수, 단어 수는 공백 기준, 공백 수는 줄바꿈·탭을 포함합니다.";details.classList.add("show")}
function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
analyze.onclick=async()=>{if(!selectedFile)return;analyze.disabled=true;status.textContent="문서를 분석하고 있습니다…";try{let ext=selectedFile.name.toLowerCase().split(".").pop(),d=ext==="pdf"?await analyzePDF(selectedFile):await analyzeDOCX(selectedFile);show(d,ext);status.textContent="분석이 완료되었습니다."}catch(e){console.error(e);status.textContent="분석 중 오류가 발생했습니다. 파일이 손상되었거나 보호된 문서일 수 있습니다."}finally{analyze.disabled=false}};
document.getElementById("reset").onclick=()=>{selectedFile=null;fileInput.value="";nameEl.textContent="선택된 파일 없음";status.textContent="";results.classList.remove("show");details.classList.remove("show");analyze.disabled=true};
</script></body></html>
