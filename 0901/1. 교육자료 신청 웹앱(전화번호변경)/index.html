<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <style>
      body {
        font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
        background-color: #FFF5F2; 
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
        box-sizing: border-box;
      }
      
      .card {
        background: #ffffff;
        padding: 40px 30px;
        border-radius: 16px;
        box-shadow: 0 8px 24px rgba(255, 122, 89, 0.08);
        width: 100%;
        max-width: 400px;
        box-sizing: border-box;
      }

      h2 {
        margin-top: 0;
        color: #FF7A59;
        text-align: center;
        margin-bottom: 28px;
        font-size: 24px;
        font-weight: 700;
      }

      .form-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #555555;
        font-size: 14px;
      }

      input[type="text"],
      input[type="email"],
      textarea {
        width: 100%;
        padding: 14px;
        border: 2px solid #FFE4DD;
        border-radius: 10px;
        box-sizing: border-box;
        font-size: 15px;
        color: #333;
        outline: none;
        transition: all 0.3s ease;
        background-color: #FAFAFA;
      }

      input[type="text"]:focus,
      input[type="email"]:focus,
      textarea:focus {
        border-color: #FF7A59;
        background-color: #FFFFFF;
      }

      textarea {
        resize: vertical;
        height: 100px;
      }

      button {
        width: 100%;
        padding: 15px;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: background-color 0.3s, transform 0.1s;
        margin-top: 10px;
      }

      #submit-btn {
        background-color: #FF7A59;
        color: white;
      }

      #submit-btn:hover {
        background-color: #E86343;
      }

      #submit-btn:disabled {
        background-color: #FFCDBF;
        cursor: not-allowed;
      }

      #result-message {
        display: none;
        text-align: center;
      }

      .success-text {
        font-size: 20px;
        font-weight: bold;
        color: #333333;
        line-height: 1.6;
        margin-bottom: 30px;
        padding: 20px 0;
      }

      #back-btn {
        background-color: #F0F0F0;
        color: #555555;
      }

      #back-btn:hover {
        background-color: #E2E2E2;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <!-- 폼 입력 영역 -->
      <div id="form-container">
        <h2>교육자료 신청</h2>
        <form id="apply-form">
          <div class="form-group">
            <label for="name">이름</label>
            <input type="text" id="name" required placeholder="이름을 입력해주세요">
          </div>
          <div class="form-group">
            <label for="email">이메일</label>
            <input type="email" id="email" required placeholder="이메일을 입력해주세요">
          </div>
          <div class="form-group">
            <label for="message">교수님께 하고 싶은 말</label>
            <textarea id="message" placeholder="자유롭게 작성해주세요"></textarea>
          </div>
          <button type="submit" id="submit-btn">확인</button>
        </form>
      </div>

      <!-- 제출 완료 및 뒤로가기 영역 -->
      <div id="result-message">
        <div class="success-text">
          오늘 교육 받느라<br>수고하셨습니다! 🌸
        </div>
        <button type="button" id="back-btn">다시 신청하기 (뒤로가기)</button>
      </div>
    </div>

    <script>
      document.getElementById('apply-form').addEventListener('submit', function(e) {
        e.preventDefault();
        
        var submitBtn = document.getElementById('submit-btn');
        submitBtn.disabled = true;
        submitBtn.innerText = '제출 중...';

        var formData = {
          name: document.getElementById('name').value,
          email: document.getElementById('email').value,
          message: document.getElementById('message').value
        };

        google.script.run
          .withSuccessHandler(function(response) {
            if (response.success) {
              document.getElementById('form-container').style.display = 'none';
              document.getElementById('result-message').style.display = 'block';
            } else {
              alert('오류가 발생했습니다: ' + response.error);
              submitBtn.disabled = false;
              submitBtn.innerText = '확인';
            }
          })
          .withFailureHandler(function(err) {
            alert('오류가 발생했습니다: ' + err);
            submitBtn.disabled = false;
            submitBtn.innerText = '확인';
          })
          .saveData(formData);
      });

      document.getElementById('back-btn').addEventListener('click', function() {
        document.getElementById('apply-form').reset();
        document.getElementById('result-message').style.display = 'none';
        document.getElementById('form-container').style.display = 'block';
        
        var submitBtn = document.getElementById('submit-btn');
        submitBtn.disabled = false;
        submitBtn.innerText = '확인';
      });
    </script>
  </body>
</html>
