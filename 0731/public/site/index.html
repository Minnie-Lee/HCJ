<title>BUSAN — 부산 관광 안내</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root{
    --navy:#0b2036;
    --navy-deep:#071526;
    --teal:#1c6e8c;
    --coral:#ff6f52;
    --gold:#f0b642;
    --paper:#f6efe0;
    --ink:#1c1a16;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--navy);
    font-family:'Gowun Dodum', sans-serif;
    color:var(--paper);
  }

  /* ---------- NAV ---------- */
  .nav{
    position:absolute; top:0; left:0; right:0; z-index:50;
    display:flex; align-items:center; justify-content:space-between;
    padding: 24px 5vw 0;
  }
  .nav .logo{ font-family:'Song Myung', serif; font-size:1.5rem; letter-spacing:0.14em; }
  .nav .logo span{ color:var(--gold); }
  .nav ul{ list-style:none; display:flex; gap:30px; margin:0; padding:0; font-size:0.92rem; }
  .nav ul li a{ color:rgba(246,239,224,0.85); text-decoration:none; }
  .nav ul li a:hover{ color:var(--gold); }
  .nav .right{ display:flex; align-items:center; gap:18px; }
  .nav .lang{ font-size:0.78rem; letter-spacing:0.08em; color:rgba(246,239,224,0.65); border:1px solid rgba(246,239,224,0.3); padding:5px 12px; border-radius:999px; }
  .nav .lang .lang-option{ cursor:pointer; transition:color .2s ease; }
  .nav .lang .lang-option:hover{ color:var(--gold); }
  .nav .lang .lang-option.active{ color:var(--gold); font-weight:600; }
  @media (max-width:820px){ .nav ul{ display:none; } }

  /* ---------- HERO / SLIDES ---------- */
  .hero{
    position:relative;
    height:100vh;
    min-height:640px;
    overflow:hidden;
  }
  .slide{
    position:absolute; inset:0;
    opacity:0;
    transform:scale(1.08);
    transition: opacity 1.4s ease;
    z-index:1;
  }
  .slide.active{
    opacity:1;
    z-index:2;
    animation: kenburns 9s ease-out forwards;
  }
  .slide img{ width:100%; height:100%; object-fit:cover; display:block; }
  @keyframes kenburns{
    from{ transform:scale(1.08); }
    to{ transform:scale(1.0); }
  }
  .hero::after{
    content:"";
    position:absolute; inset:0; z-index:3;
    background:
      linear-gradient(180deg, rgba(7,21,38,0.65) 0%, rgba(7,21,38,0.1) 28%, rgba(7,21,38,0.25) 62%, rgba(7,21,38,0.92) 100%);
  }

  .hero-content{
    position:relative; z-index:10;
    height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    padding: 0 20px;
  }
  .eyebrow{
    font-size:1.02rem;
    color:var(--paper);
    margin-bottom:14px;
    opacity:0.92;
    min-height:1.4em;
  }
  .hero-title{
    font-family:'Song Myung', serif;
    font-size:clamp(3rem, 7vw, 5.2rem);
    margin:0 0 22px;
    letter-spacing:0.02em;
    text-shadow:0 12px 34px rgba(0,0,0,0.5);
    min-height:1.2em;
  }
  .cta{
    display:inline-flex; align-items:center; gap:10px;
    background:var(--coral);
    color:#fff6ee;
    font-size:1.05rem;
    padding:16px 34px;
    border-radius:999px;
    text-decoration:none;
    box-shadow:0 16px 32px rgba(255,111,82,0.4);
    transition:transform .25s ease, box-shadow .25s ease;
  }
  .cta:hover{ transform:translateY(-3px); box-shadow:0 20px 40px rgba(255,111,82,0.5); }
  .cta svg{ width:17px; height:17px; }

  .locpin{
    margin-top:26px;
    display:inline-flex; align-items:center; gap:8px;
    font-size:0.88rem;
    color:rgba(246,239,224,0.85);
  }
  .locpin svg{ width:15px; height:15px; color:var(--gold); }

  /* ---------- Slide controls (dots + arrows + counter) ---------- */
  .slide-controls{
    position:absolute; left:50%; bottom:34px; transform:translateX(-50%);
    z-index:20;
    display:flex; align-items:center; gap:16px;
  }
  .arrow-btn{
    width:34px; height:34px; border-radius:50%;
    border:1px solid rgba(246,239,224,0.4);
    background:rgba(11,32,54,0.4);
    color:var(--paper);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .arrow-btn:hover{ background:rgba(240,182,66,0.25); border-color:var(--gold); }
  .arrow-btn svg{ width:15px; height:15px; }
  .dots{ display:flex; gap:8px; }
  .dot{ width:7px; height:7px; border-radius:50%; background:rgba(246,239,224,0.4); cursor:pointer; transition:background .2s, transform .2s; }
  .dot.active{ background:var(--gold); transform:scale(1.3); }
  .counter{ font-size:0.72rem; letter-spacing:0.1em; color:rgba(246,239,224,0.7); font-family:'Black Han Sans',sans-serif; }

  /* ---------- Theme chips (bottom-left) ---------- */
  .chip-panel{
    position:absolute; left:5vw; bottom:34px; z-index:20;
    display:flex; align-items:center; gap:12px;
  }
  .chip-panel .gull{ width:34px; height:34px; flex:0 0 auto; }
  .chip-list{ display:flex; gap:8px; flex-wrap:wrap; max-width:340px; }
  .chip{
    font-size:0.78rem;
    padding:7px 14px;
    border-radius:999px;
    background:rgba(246,239,224,0.12);
    border:1px solid rgba(246,239,224,0.28);
    color:var(--paper);
    text-decoration:none;
    white-space:nowrap;
  }
  .chip:hover{ background:rgba(240,182,66,0.25); border-color:var(--gold); }
  @media (max-width:900px){ .chip-panel{ display:none; } }

  /* ---------- Floating promo card (bottom-right) ---------- */
  .promo-card{
    position:absolute; right:5vw; bottom:100px; z-index:20;
    width:190px;
    background:linear-gradient(160deg, var(--coral), #e14e3a);
    border-radius:14px;
    padding:16px 16px 18px;
    box-shadow:0 20px 40px rgba(0,0,0,0.35);
    text-decoration:none;
    color:#fff6ee;
    display:block;
  }
  .promo-card .tag{ font-size:0.68rem; letter-spacing:0.08em; opacity:0.85; }
  .promo-card .title{ font-family:'Black Han Sans',sans-serif; font-size:0.98rem; margin:6px 0 10px; line-height:1.35; }
  .promo-card .go{ font-size:0.78rem; display:flex; align-items:center; gap:6px; }
  .promo-card .go svg{ width:12px; height:12px; }
  @media (max-width:900px){ .promo-card{ display:none; } }

  @media (prefers-reduced-motion: reduce){
    .slide.active{ animation:none; }
  }
</style>
</head>

      ja: { eyebrow: "階段ごとに彩られた村", title: "甘川文化村", loc: "釜山沙下区" },
      en: { eyebrow: "A village colored on every stair", title: "Gamcheon Culture Village", loc: "Saha-gu, Busan" },
      zh: { eyebrow: "每个阶梯都充满色彩的村庄", title: "甘川文化村", loc: "釜山沙下区" } },
    { ko: { eyebrow: "도심 속에서 만나는 부산 대표 해변", title: "해운대", loc: "부산 해운대구" },
      ja: { eyebrow: "都心で出会う釜山を代表するビーチ", title: "海雲台", loc: "釜山海雲台区" },
      en: { eyebrow: "Busan's representative beach in the city", title: "Haeundae", loc: "Haeundae-gu, Busan" },
      zh: { eyebrow: "在市中心遇见的釜山代表性海滩", title: "海云台", loc: "釜山海云台区" } },
    { ko: { eyebrow: "파도 위에 세워진 천년 사찰", title: "용궁사", loc: "부산 기장군" },
      ja: { eyebrow: "波の上に建てられた千年の寺", title: "龍宮寺", loc: "釜山機張郡" },
      en: { eyebrow: "A thousand-year-old temple built on the waves", title: "Yonggungsa", loc: "Gijang-gun, Busan" },
      zh: { eyebrow: "建在海浪上的千年古刹", title: "海东龙宫寺", loc: "釜山机张郡" } },
  ];

  const slides = document.querySelectorAll('.slide');
  const dots = document.querySelectorAll('.dot');
  const eyebrowEl = document.getElementById('eyebrow');
  const titleEl = document.getElementById('title');
  const locEl = document.getElementById('locname');
  const counterEl = document.getElementById('counter');
  let current = 0;
  let currentLang = 'ko';
  let timer;

  function pad(n){ return String(n+1).padStart(2,'0'); }

  function goTo(i){
    current = (i + slides.length) % slides.length;
    slides.forEach(s => s.classList.toggle('active', +s.dataset.i === current));
    dots.forEach(d => d.classList.toggle('active', +d.dataset.i === current));
    eyebrowEl.style.opacity = 0;
    titleEl.style.opacity = 0;
    setTimeout(() => {
      const data = slidesData[current][currentLang];
      eyebrowEl.textContent = data.eyebrow;
      titleEl.textContent = data.title;
      locEl.textContent = data.loc;
      eyebrowEl.style.transition = titleEl.style.transition = 'opacity .5s ease';
      eyebrowEl.style.opacity = 1;
      titleEl.style.opacity = 1;
    }, 250);
    counterEl.textContent = pad(current) + ' / ' + pad(slides.length - 1);
  }

  function next(){ goTo(current + 1); resetTimer(); }
  function prev(){ goTo(current - 1); resetTimer(); }
  function resetTimer(){ clearInterval(timer); timer = setInterval(() => goTo(current + 1), 5500); }

  dots.forEach(d => d.addEventListener('click', () => { goTo(+d.dataset.i); resetTimer(); }));
  document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', (e) => {
    e.preventDefault();
    goTo(+c.dataset.goto); resetTimer();
  }));

  // ---------- 언어 전환 ----------
  function applyLang(lang){
    currentLang = lang;
    document.querySelectorAll('.lang-option').forEach(opt => {
      opt.classList.toggle('active', opt.dataset.lang === lang);
    });
    document.querySelectorAll('[data-ko][data-ja]').forEach(el => {
      if (lang === 'ja') el.textContent = el.dataset.ja;
      else if (lang === 'en') el.textContent = el.dataset.en;
      else if (lang === 'zh') el.textContent = el.dataset.zh;
      else el.textContent = el.dataset.ko;
    });
    const data = slidesData[current][lang];
    eyebrowEl.textContent = data.eyebrow;
    titleEl.textContent = data.title;
    locEl.textContent = data.loc;
    document.documentElement.lang = lang;
  }

  document.querySelectorAll('.lang-option').forEach(opt => {
    opt.addEventListener('click', () => applyLang(opt.dataset.lang));
  });

  resetTimer();
</script>

</body>
</html>
